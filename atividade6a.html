<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            font-weight: bold;
            line-height: 200px;
            text-align: center;
            box-sizing: border-box;
            height: 200px;
        }
        #box1 {
            background-color: blue;
        }  
        #box2 {
            background-color: green;
        }
        #box3 {
            background-color: red;
        }
        #box4 {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>
    </div>

    <p>
        A exibição fica assim porque as tags div são elementos de bloco por predefinição, o que significa
        que ocupam toda a largura horizontal disponível e forçam uma quebra de linha automática após cada
        elemento, impedindo que fiquem lado a lado.
    </p>
</body>
</html>
