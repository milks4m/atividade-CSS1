<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 10 - Barquinho no Mar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
        }

        .cena {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #1e90ff, #87ceeb, #e0f6ff);
            overflow: hidden;
        }

        .nuvem {
            position: absolute;
            top: 50px;
            left: -150px;
            width: 120px;
            height: 40px;
            background: #ffffff;
            border-radius: 50px;
            box-shadow: 40px 10px 0 10px #ffffff, 80px 0 0 5px #ffffff;
            animation: moverNuvem 25s linear infinite;
            z-index: 1;
        }

        @keyframes moverNuvem {
            0% { left: -150px; }
            100% { left: 105vw; }
        }

        .mar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 180px;
            background-color: #004d80;
            border-top: 5px solid #ffffff;
            z-index: 2;
            overflow: hidden;
        }

        .mar::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 25px;
            background: repeating-linear-gradient(45deg, #006699, #006699 15px, #ffffff 15px, #ffffff 30px);
            opacity: 0.8;
            animation: moverOndas 4s linear infinite;
        }

        @keyframes moverOndas {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .barquinho {
            position: absolute;
            bottom: 60px;
            left: -100px;
            width: 90px;
            height: 40px;
            background-color: #8B4513;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            animation: navegarBarco 18s linear infinite, balancarBarco 2s ease-in-out infinite alternate;
            z-index: 3; 
        }

        .vela {
            position: absolute;
            bottom: 40px;
            left: 45px;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 5px solid transparent;
            border-bottom: 55px solid #ffffff;
        }

        @keyframes navegarBarco {
            0% { left: -100px; }
            100% { left: 105vw; }
        }

        @keyframes balancarBarco {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }
    </style>
</head>
<body>

    <div class="cena">
        <div class="nuvem"></div>
        <div class="mar"></div>
        <div class="barquinho">
            <div class="vela"></div>
        </div>
    </div>

</body>
</html>
